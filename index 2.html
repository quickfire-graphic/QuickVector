<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#14171c"><meta name="apple-mobile-web-app-capable" content="yes">
<title>QuickVector Studio 0.5</title>
<style>
:root{--bg:#14171c;--p:#1d2128;--p2:#262b34;--ln:#343b46;--tx:#eef0f3;--mu:#9aa3b0;--ac:#ff7a1a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select{font:inherit;color:inherit}
button{background:var(--p2);border:1px solid var(--ln);border-radius:9px;min-height:38px;min-width:38px;padding:0 10px;cursor:pointer;touch-action:manipulation;white-space:nowrap}
button:hover{border-color:#667}button.on{background:var(--ac);border-color:var(--ac);color:#17191d;font-weight:700}button:disabled{opacity:.35}
input,select{background:#101318;border:1px solid var(--ln);border-radius:8px;padding:7px;min-width:0;width:100%}
input[type=color]{padding:2px;height:34px}input[type=checkbox]{width:auto}
.hide{display:none!important}
#app{height:100dvh;display:grid;grid-template:"h h h" auto "t w s" 1fr "t c s" auto/54px 1fr 262px;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{grid-area:h;display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--p);border-bottom:1px solid var(--ln)}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;flex:none}.brand i{width:30px;height:30px;border-radius:8px;background:var(--ac);color:#17191d;display:grid;place-items:center;font-style:normal}.brand small{color:var(--mu);font-weight:500}
nav{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none}
#tools{grid-area:t;display:flex;flex-direction:column;gap:6px;padding:8px;background:var(--p);border-right:1px solid var(--ln);overflow-y:auto}
#wrap{grid-area:w;min-height:0;position:relative;background:radial-gradient(#2a303a 1px,transparent 1px) 0 0/18px 18px}
#cv{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#zoom{position:absolute;right:10px;bottom:10px;display:flex;gap:6px;align-items:center;background:#000a;padding:5px;border-radius:11px}
#cmd{grid-area:c;padding:8px 10px;background:var(--p);border-top:1px solid var(--ln)}
#cmd form{display:flex;gap:8px}#fb{color:var(--mu);margin-top:6px;min-height:18px;font-size:12px}
#side{grid-area:s;overflow-y:auto;padding:10px;background:var(--p);border-left:1px solid var(--ln)}
h4{margin:14px 0 7px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mu)}h4:first-child{margin-top:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
label{display:block;color:var(--mu);font-size:11px}
#layers{display:flex;flex-direction:column;gap:5px}#layers button{text-align:left;display:flex;justify-content:space-between;gap:6px;min-height:34px}#layers button.on{background:#4a3524;color:var(--tx);border-color:var(--ac)}
dialog{background:var(--p);color:var(--tx);border:1px solid var(--ln);border-radius:14px;max-width:420px;width:92vw}dialog::backdrop{background:#000b}dialog label{margin-top:10px}
@media(max-width:820px){
#app{height:auto;min-height:100dvh;grid-template:"h" auto "t" auto "w" 58dvh "c" auto "s" auto/1fr}
#tools{flex-direction:row;border-right:0;border-bottom:1px solid var(--ln)}#tools button{flex:none}#side{border-left:0}.brand small{display:none}}
</style></head><body>
<div id="app">
<header><div class="brand"><i>Q</i>QuickVector <small>0.5</small></div>
<nav><button id="undo" title="Undo (Ctrl+Z)">↶</button><button id="redo" title="Redo">↷</button><button id="new">New</button><button id="open">Open</button><button id="save">Save</button><button id="imp">Import SVG</button><button id="svg">SVG</button><button id="png">PNG</button><button id="ai">⚙ AI</button></nav>
<input id="file" type="file" hidden></header>
<aside id="tools"></aside>
<main id="wrap"><svg id="cv" xmlns="http://www.w3.org/2000/svg"><rect id="pg" fill="#fff" style="filter:drop-shadow(0 8px 24px #000a)" pointer-events="none"/><g id="art"></g><g id="ui"></g></svg>
<div id="zoom"><button id="zo">−</button><span id="zv">100%</span><button id="zi">+</button><button id="fit">Fit</button></div></main>
<section id="cmd"><form id="cf"><input id="ci" autocomplete="off" placeholder="Type a command, e.g. add red star — or anything, if AI is on" aria-label="Command"><button class="on">Run</button></form><div id="fb">Type “help” for commands. Everything works offline; AI is optional (⚙ AI).</div></section>
<aside id="side">
<h4>Appearance</h4>
<div class="g2"><div><label>Fill</label><input id="fillI" type="color" value="#ff7a1a"></div><div><label>Stroke</label><input id="strI" type="color" value="#20242b"></div></div>
<div class="g3" style="margin-top:6px"><div><label>Width</label><input id="swI" type="number" min="0" max="100" step=".5" value="1"></div><div><label>Opacity</label><input id="opI" type="range" min="0" max="1" step=".05" value="1"></div><div><label>Radius</label><input id="rI" type="number" min="0" value="0"></div></div>
<label style="margin-top:6px"><input type="checkbox" id="noFill"> No fill</label>
<h4>Text</h4><input id="txtI" value="QuickVector"><div class="g2" style="margin-top:6px"><input id="fsI" type="number" min="6" max="600" value="36"><select id="ffS"><option>Arial, sans-serif</option><option>Georgia, serif</option><option>"Courier New", monospace</option><option>Impact, sans-serif</option><option>"Trebuchet MS", sans-serif</option></select></div>
<h4>Position &amp; size</h4><div class="g4"><div><label>X</label><input id="xI" type="number"></div><div><label>Y</label><input id="yI" type="number"></div><div><label>W</label><input id="wI" type="number"></div><div><label>H</label><input id="hI" type="number"></div></div>
<h4>Arrange</h4><div class="g4"><button data-a="front">⤒</button><button data-a="forward">▲</button><button data-a="backward">▼</button><button data-a="back">⤓</button></div>
<div class="g4" style="margin-top:6px"><button id="rotL">⟲</button><button id="rotR">⟳</button><button id="dup">Copy</button><button id="del">Del</button></div>
<div class="g3" style="margin-top:6px"><button id="msel">＋Multi</button><button id="sall">All</button><button id="grp">Group</button><button id="ugrp">Ungroup</button><button id="smo">Smooth</button><button id="grad">Gradient</button></div><h4>Align to page</h4><div class="g3"><button data-al="left">⇤</button><button data-al="center">↔</button><button data-al="right">⇥</button><button data-al="top">⤒</button><button data-al="middle">↕</button><button data-al="bottom">⤓</button></div>
<h4>Page</h4><select id="preset"><option value="">Preset…</option><option>default</option><option>a4</option><option>letter</option><option>square</option><option>story</option><option>landscape</option></select>
<div class="g3" style="margin-top:6px"><input id="pw" type="number" title="Width"><input id="ph" type="number" title="Height"><input id="bgI" type="color" value="#ffffff"></div>
<h4>Layers</h4><div id="layers"></div></aside></div>
<dialog id="cfgD"><form method="dialog"><b>AI settings (optional)</b><label>API URL — use your own proxy so no key lives in the browser</label><input id="cUrl" placeholder="https://api.anthropic.com/v1/messages"><label>API key (stored only on this device)</label><input id="cKey" type="password" autocomplete="off"><label>Model</label><input id="cMod" placeholder="claude-sonnet-5-5"><div class="g3" style="margin-top:14px"><button value="s" class="on">Save</button><button value="c" id="cClr">Clear</button><button value="x">Close</button></div></form></dialog>
<script>
(()=>{
const $=s=>document.querySelector(s),ns='http://www.w3.org/2000/svg',cv=$('#cv'),art=$('#art'),ui=$('#ui'),pg=$('#pg'),wrap=$('#wrap');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,+v||0)),I=()=>cv.createSVGMatrix(),LS={g:k=>{try{return localStorage.getItem(k)}catch(e){return null}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let W=800,H=600,tool='select',sel=null,nid=1,hist=[],hi=-1,drag=null,pen=[],view={cx:400,cy:300,z:1},space=false,cfg=JSON.parse(LS.g('qv_cfg')||'{}'),extra=[],multiOn=false;
const ptr=new Map(),PRE={default:[800,600],a4:[794,1123],letter:[816,1056],square:[1080,1080],story:[1080,1920],landscape:[1280,720]};
const NAMED={orange:'#ff7a1a',black:'#111111',white:'#ffffff',red:'#e53935',blue:'#2878e5',green:'#159947',yellow:'#ffd43b',purple:'#8b5cf6',pink:'#ec4899',grey:'#808080',gray:'#808080',teal:'#0f9d9a',navy:'#142c54',gold:'#d4a017',brown:'#8b5e3c'};
const col=v=>{if(v==null||v==='')return null;v=String(v).trim().toLowerCase();return NAMED[v]||(v==='none'||CSS.supports('color',v)?v:null)};
const say=m=>{$('#fb').textContent=m};
const mk=(t,a={})=>{const e=document.createElementNS(ns,t);for(const k in a)e.setAttribute(k,a[k]);return e};
const byId=id=>art.querySelector('[data-id="'+id+'"]');
/* ---------- geometry ---------- */
const cur=el=>{const t=el.transform.baseVal;return t.numberOfItems?t.consolidate().matrix:I()};
const setM=(el,m)=>el.setAttribute('transform','matrix('+[m.a,m.b,m.c,m.d,m.e,m.f].map(n=>+n.toFixed(4))+')');
const wb=el=>{const b=el.getBBox(),m=cur(el),P=[[b.x,b.y],[b.x+b.width,b.y],[b.x,b.y+b.height],[b.x+b.width,b.y+b.height]].map(([x,y])=>[m.a*x+m.c*y+m.e,m.b*x+m.d*y+m.f]),xs=P.map(p=>p[0]),ys=P.map(p=>p[1]),x=Math.min(...xs),y=Math.min(...ys);return{x,y,w:Math.max(...xs)-x,h:Math.max(...ys)-y}};
const box=(el,p)=>{let b=wb(el);if((p.w&&b.w)||(p.h&&b.h)){setM(el,I().translate(b.x,b.y).scale(p.w&&b.w?p.w/b.w:1,p.h&&b.h?p.h/b.h:1).translate(-b.x,-b.y).multiply(cur(el)));b=wb(el)}
 if(p.x!=null||p.y!=null)setM(el,I().translate(p.x!=null?p.x-b.x:0,p.y!=null?p.y-b.y:0).multiply(cur(el)))};
const starPts=(cx,cy,r,n=5)=>Array.from({length:n*2},(_,i)=>{const a=Math.PI*i/n-Math.PI/2,rr=i%2?r*.45:r;return(cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1)}).join(' ');
/* ---------- objects ---------- */
function reg(el){el.classList.add('object');el.dataset.id=nid++;if(!/^(g|text)$/.test(el.tagName))el.setAttribute('vector-effect','non-scaling-stroke');art.appendChild(el);select(el);return el}
function add(type,p={}){const f=col(p.fill)||($('#noFill').checked?'none':$('#fillI').value),s=col(p.stroke)||$('#strI').value,sw=p.strokeWidth??+$('#swI').value,w=p.w||160,h=p.h||(type==='ellipse'||type==='star'?w:100),x=p.x??(W-w)/2,y=p.y??(H-h)/2,B={fill:f,stroke:s,'stroke-width':sw};let el;
 if(type==='rect')el=mk('rect',{x,y,width:w,height:h,rx:p.radius||0,...B});
 else if(type==='ellipse')el=mk('ellipse',{cx:x+w/2,cy:y+h/2,rx:w/2,ry:h/2,...B});
 else if(type==='line')el=mk('line',{x1:x,y1:y,x2:x+(p.w||240),y2:y+(p.h||0),fill:'none',stroke:s,'stroke-width':Math.max(1,sw),'stroke-linecap':'round'});
 else if(type==='star')el=mk('polygon',{points:starPts(x+w/2,y+h/2,Math.min(w,h)/2,p.sides||5),...B});
 else if(type==='polygon'){const pts=(p.points||[]).map(q=>Array.isArray(q)?q.join(','):q).join(' ');if(!pts)throw Error('points required');el=mk('polygon',{points:pts,...B})}
 else if(type==='path'){if(!p.d)throw Error('d required');el=mk('path',{d:p.d,...B})}
 else if(type==='text'){el=mk('text',{x:p.x??W/2-100,y:p.y??H/2,fill:f==='none'?'#20242b':f,stroke:'none','font-size':clamp(p.fontSize||$('#fsI').value,6,600),'font-family':p.fontFamily||$('#ffS').value,'font-weight':600});el.textContent=p.text||$('#txtI').value||'Text'}
 else throw Error('unknown shape type '+type);
 reg(el);if(p.opacity!=null||p.rotate||p.name)setProps(el,{opacity:p.opacity,rotate:p.rotate,name:p.name});return el}
function setProps(el,p){const A=(k,v)=>el.setAttribute(k,v);let c;
 if(p.fill!=null&&(c=col(p.fill)))A('fill',c);if(p.stroke!=null&&(c=col(p.stroke)))A('stroke',c);
 if(p.strokeWidth!=null)A('stroke-width',clamp(p.strokeWidth,0,100));if(p.opacity!=null)A('opacity',clamp(p.opacity,0,1));
 if(p.radius!=null&&el.tagName==='rect')A('rx',Math.max(0,+p.radius||0));
 if(el.tagName==='text'){if(p.text!=null)el.textContent=p.text;if(p.fontSize)A('font-size',clamp(p.fontSize,6,600));if(p.fontFamily)A('font-family',p.fontFamily)}
 if(p.name)el.dataset.name=String(p.name).slice(0,40);if(p.hidden!=null)A('visibility',p.hidden?'hidden':'visible');
 if(p.rotate){const b=wb(el),cx=b.x+b.w/2,cy=b.y+b.h/2;setM(el,I().translate(cx,cy).rotate(+p.rotate).translate(-cx,-cy).multiply(cur(el)))}
 box(el,p)}
function arrange(el,a){const k=[...art.children].filter(e=>e.classList.contains('object')),i=k.indexOf(el);
 if(a==='front')art.appendChild(el);else if(a==='back')art.insertBefore(el,art.firstChild);
 else if(a==='forward'&&k[i+1])k[i+1].after(el);else if(a==='backward'&&i>0)k[i-1].before(el)}
function align(el,to){const b=wb(el),p={left:{x:0},right:{x:W-b.w},center:{x:(W-b.w)/2},top:{y:0},bottom:{y:H-b.h},middle:{y:(H-b.h)/2}}[to];if(!p)throw Error('bad alignment');box(el,p)}
function setPage(w,h,bg,quiet){W=clamp(w,16,8000);H=clamp(h,16,8000);pg.setAttribute('width',W);pg.setAttribute('height',H);if(bg&&col(bg))pg.setAttribute('fill',col(bg));$('#pw').value=W;$('#ph').value=H;const f=pg.getAttribute('fill');if(/^#[0-9a-f]{6}$/i.test(f))$('#bgI').value=f;if(!quiet)fit()}
/* ---------- tool registry: used by BOTH the local parser and the AI ---------- */
const S={type:'string'},N={type:'number'};
const PR={id:{type:'integer',description:'object id; omit to use the selected object'},fill:{type:'string',description:'colour name, #hex or none'},stroke:S,strokeWidth:N,opacity:{type:'number',description:'0 to 1'},x:{type:'number',description:'left edge, px'},y:{type:'number',description:'top edge, px'},w:{type:'number',description:'width, px'},h:{type:'number',description:'height, px'},radius:N,text:S,fontSize:N,fontFamily:S,rotate:{type:'number',description:'degrees, relative'},name:S,hidden:{type:'boolean'}};
const get=a=>{const el=a.id!=null?byId(a.id):sel;if(!el)throw Error('no such object; call get_state or select one');return el};
const TOOLS={
get_state:{d:'Return page size, selection and every object (id, kind, bounding box, colours, text). Call first when you need ids or positions.',p:{},fn:()=>({page:{w:W,h:H,bg:pg.getAttribute('fill')},selected:sel?+sel.dataset.id:null,objects:[...art.children].filter(e=>e.classList.contains('object')).map(e=>{const b=wb(e);return{id:+e.dataset.id,kind:e.tagName,name:e.dataset.name,x:Math.round(b.x),y:Math.round(b.y),w:Math.round(b.w),h:Math.round(b.h),fill:e.getAttribute('fill'),stroke:e.getAttribute('stroke'),text:e.tagName==='text'?e.textContent:undefined,hidden:e.getAttribute('visibility')==='hidden'||undefined}})})},
add_shape:{d:'Add an object. type: rect, ellipse, line, star, polygon, path, text. Origin is top-left of the page. path uses SVG path data in d; polygon uses points [[x,y],...].',p:{type:{type:'string',enum:['rect','ellipse','line','star','polygon','path','text']},...PR,d:S,points:{type:'array',items:{type:'array',items:N}},sides:N},r:['type'],fn:a=>'added id '+add(a.type,a).dataset.id},
update_object:{d:'Change properties of an object: colours, stroke, opacity, corner radius, text, font, position (x,y), size (w,h), relative rotation, name, hidden.',p:PR,fn:a=>{setProps(get(a),a);return'ok'}},
delete_object:{d:'Delete an object.',p:{id:PR.id},fn:a=>{(a.id!=null?[get(a)]:[sel,...extra].filter(Boolean)).forEach(e=>e.remove());sel=null;extra=[];return'deleted'}},
duplicate_object:{d:'Duplicate an object, offset by 20px; returns the new id.',p:{id:PR.id},fn:a=>{const e=get(a),c=e.cloneNode(true);c.dataset.id=nid++;art.appendChild(c);box(c,{x:wb(c).x+20,y:wb(c).y+20});select(c);return'new id '+c.dataset.id}},
arrange:{d:'Change stacking order.',p:{id:PR.id,action:{type:'string',enum:['front','back','forward','backward']}},r:['action'],fn:a=>{arrange(get(a),a.action);return'ok'}},
align_object:{d:'Align an object to the page edge or centre.',p:{id:PR.id,to:{type:'string',enum:['left','center','right','top','middle','bottom']}},r:['to'],fn:a=>{(a.id!=null?[get(a)]:[sel,...extra].filter(Boolean)).forEach(e=>align(e,a.to));return'ok'}},
select_object:{d:'Select an object by id.',p:{id:PR.id},r:['id'],fn:a=>{select(get(a));return'ok'}},
set_page:{d:'Set page size and/or background. preset: default, a4, letter, square, story, landscape.',p:{width:N,height:N,background:S,preset:S},fn:a=>{const q=PRE[a.preset]||[a.width||W,a.height||H];setPage(q[0],q[1],a.background);return'page '+W+'x'+H}},
clear_page:{d:'Remove every object from the page.',p:{},fn:()=>{art.replaceChildren();sel=null;return'cleared'}},
undo:{d:'Undo the last change.',p:{},fn:()=>{go(hi-1);return'ok'}},redo:{d:'Redo.',p:{},fn:()=>{go(hi+1);return'ok'}},
select_all:{d:'Select every object.',p:{},fn:()=>{const k=[...art.children].filter(e=>e.classList.contains('object'));sel=k.pop()||null;extra=k;return'selected '+(k.length+1)}},
group_objects:{d:'Group the selected objects (select 2+ first, or pass ids).',p:{ids:{type:'array',items:{type:'integer'}}},fn:a=>{const L=(a.ids?a.ids.map(byId):[sel,...extra]).filter(Boolean);if(L.length<2)throw Error('need 2+ objects');const g=mk('g');[...art.children].filter(e=>L.includes(e)).forEach(k=>g.append(k));reg(g);return'grouped as id '+g.dataset.id}},
ungroup:{d:'Ungroup a group.',p:{id:PR.id},fn:a=>{const g=get(a);if(g.tagName!=='g')throw Error('not a group');const m=cur(g),K=[...g.children];K.forEach(k=>{setM(k,m.multiply(cur(k)));art.insertBefore(k,g)});g.remove();sel=K[0]||null;extra=K.slice(1);return'ungrouped'}},
set_gradient:{d:'Fill an object with a linear gradient between two colours; angle in degrees (0 = left to right).',p:{id:PR.id,from:S,to:S,angle:N},r:['from','to'],fn:a=>{const e=get(a),id='g'+nid++,r=(+a.angle||0)*Math.PI/180,c=Math.cos(r)/2,s=Math.sin(r)/2,g=mk('linearGradient',{id,x1:.5-c,y1:.5-s,x2:.5+c,y2:.5+s});[[0,a.from],[1,a.to]].forEach(([o,k])=>g.append(mk('stop',{offset:o,'stop-color':col(k)||'#000'})));art.append(g);e.setAttribute('fill','url(#'+id+')');return'ok'}},
smooth_path:{d:'Toggle smooth Bezier curves on a pen-drawn path (those have draggable nodes).',p:{id:PR.id,smooth:{type:'boolean'}},fn:a=>{const e=get(a);if(!e.dataset.nodes)throw Error('only pen-drawn paths have editable nodes');e.dataset.smooth=a.smooth===false?'':'1';redraw(e);return'ok'}},
text_on_path:{d:'Add text that follows an existing path (id or selected).',p:{id:PR.id,text:S,fontSize:N,fill:S},r:['text'],fn:a=>{const p=get(a);if(p.tagName!=='path')throw Error('pick a path first');p.id='p'+p.dataset.id;const t=mk('text',{fill:col(a.fill)||'#20242b','font-size':a.fontSize||28,'font-family':'Arial, sans-serif','font-weight':600}),tp=mk('textPath',{href:'#'+p.id});tp.textContent=a.text;t.append(tp);reg(t);return'added text on path'}},
export_file:{d:'Download the design as svg or png.',p:{format:{type:'string',enum:['svg','png']}},r:['format'],fn:a=>{a.format==='png'?exportPng():exportSvg();return'download started'}}};
function exec(name,args){try{const t=TOOLS[name];if(!t)throw Error('unknown tool '+name);const r=t.fn(args||{});if(!/^(get_state|select_object|select_all|export_file)$/.test(name))snap();else sync();return r}catch(e){return'Error: '+e.message}}
/* ---------- local (offline) command parser -> tool calls ---------- */
function parse(c){const l=c.toLowerCase().trim().replace(/[.!]+$/,''),M=r=>l.match(r);let m;
 if(/^(help|\?)$/.test(l))return['help'];
 if(m=M(/^(?:add|draw|make|create)\s+(?:an?\s+)?(?:(\S+)\s+)?(rect(?:angle)?|square|circle|ellipse|oval|star|line)(?:\s+(?:in\s+)?(\S+))?$/)){const k=m[2],f=col(m[1])||col(m[3]),sq=/square|circle/.test(k);return['add_shape',{type:/^rect|square/.test(k)?'rect':/circle|ellipse|oval/.test(k)?'ellipse':k,fill:f,...(sq?{w:150,h:150}:{})}]}

 else{const d=new DOMParser().parseFromString(t,'image/svg+xml'),r=d.documentElement;if(r.localName!=='svg')throw Error('Not an SVG file');const vb=(r.getAttribute('viewBox')||'').split(/[ ,]+/).map(Number);if(vb.length===4&&vb[2]>0)setPage(vb[2],vb[3]);n=load(r)}
 select(null);snap();say('Loaded '+n+' items from '+name)}
$('#save').onclick=()=>{dl(new Blob([JSON.stringify({format:'QuickVectorStudioProject',version:2,width:W,height:H,background:pg.getAttribute('fill'),objects:objs().map(e=>new XMLSerializer().serializeToString(e))},null,1)],{type:'application/json'}),'quickvector-project.qvproject');say('Saved project')};
$('#open').onclick=()=>{$('#file').accept='.qvproject,.json';$('#file').click()};$('#imp').onclick=()=>{$('#file').accept='.svg,image/svg+xml';$('#file').click()};
$('#file').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const r=new FileReader();r.onload=()=>{try{openText(String(r.result),f.name)}catch(x){say('Could not open: '+x.message)}};r.readAsText(f)};
$('#svg').onclick=exportSvg;$('#png').onclick=exportPng;
$('#ai').onclick=()=>{$('#cUrl').value=cfg.url||'';$('#cKey').value=cfg.key||'';$('#cMod').value=cfg.model||'';$('#cfgD').showModal()};
$('#cfgD').onclose=e=>{const v=$('#cfgD').returnValue;if(v==='s'){cfg={url:$('#cUrl').value.trim(),key:$('#cKey').value.trim(),model:$('#cMod').value.trim()};LS.s('qv_cfg',JSON.stringify(cfg));say('AI settings saved on this device')}if(v==='c'){cfg={};LS.s('qv_cfg','{}');say('AI settings cleared')}};
addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea'))return;const k=e.key,m=e.ctrlKey||e.metaKey;
 if(k===' '){space=true;e.preventDefault()}else if(m&&k.toLowerCase()==='z'){e.preventDefault();go(e.shiftKey?hi+1:hi-1)}else if(m&&k.toLowerCase()==='y')go(hi+1);else if(m&&k.toLowerCase()==='d'){e.preventDefault();exec('duplicate_object',{})}
 else if((k==='Delete'||k==='Backspace')&&sel)exec('delete_object',{});else if(k==='Enter'&&pen.length)finishPen(false);else if(k==='Escape'){pen=[];select(null)}
 else if(sel&&/^Arrow/.test(k)){e.preventDefault();const d=e.shiftKey?10:1,b=wb(sel);box(sel,{x:b.x+(k==='ArrowRight'?d:k==='ArrowLeft'?-d:0),y:b.y+(k==='ArrowDown'?d:k==='ArrowUp'?-d:0)});snap()}});
addEventListener('keyup',e=>{if(e.key===' ')space=false});
$('#msel').onclick=e=>{multiOn=!multiOn;e.currentTarget.classList.toggle('on',multiOn);say(multiOn?'Multi-select on: tap objects to add or remove':'Multi-select off')};
$('#sall').onclick=()=>say(exec('select_all',{}));$('#grp').onclick=()=>say(exec('group_objects',{}));$('#ugrp').onclick=()=>say(exec('ungroup',{}));$('#smo').onclick=()=>say(exec('smooth_path',{smooth:!(sel&&sel.dataset.smooth)}));$('#grad').onclick=()=>say(exec('set_gradient',{from:$('#fillI').value,to:$('#strI').value}));
/* ---------- boot ---------- */
(()=>{try{const s=JSON.parse(LS.g('qv_auto')||'null');if(s&&s.a){art.innerHTML=s.a;setPage(s.W,s.H,s.bg,true);nid=1+Math.max(0,...[...art.children].map(e=>+e.dataset.id||0));setTool('select');fit();snap();return}}catch(e){}
 setPage(800,600,'#ffffff',true);const t=(a,b,c)=>exec('add_shape',a);
 exec('add_shape',{type:'text',text:'QuickVector Studio',x:80,y:150,fontSize:46,fill:'#20242b'});exec('add_shape',{type:'text',text:'Free vector design for every device',x:82,y:195,fontSize:22,fill:'#5b6470'});
 exec('add_shape',{type:'rect',x:82,y:240,w:220,h:8,fill:'#ff7a1a',strokeWidth:0});exec('add_shape',{type:'star',x:82,y:290,w:120,fill:'#ff7a1a',stroke:'#20242b'});exec('add_shape',{type:'rect',x:230,y:310,w:200,h:70,fill:'#20242b',radius:10});
 exec('add_shape',{type:'text',text:'Say “add blue circle”',x:248,y:353,fontSize:20,fill:'#ffffff'});select(null);setTool('select');fit()})();
})();
</script></body></html>
